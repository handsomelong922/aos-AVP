name: Publish signed NOVA Zoom
on:
  push:
    branches: [nova-zoom]
    paths: ['zoom/release/release.json']
permissions:
  contents: read
concurrency:
  group: nova-zoom-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore and verify signed APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash zoom/signing/publish.sh
