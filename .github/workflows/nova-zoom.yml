name: NOVA Zoom APK build
on:
  push:
    branches: [nova-zoom]
    paths: ['zoom/**', '.github/workflows/nova-zoom.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and verify unsigned APKs
        run: bash zoom/build.sh "${RUNNER_TEMP}/nova-zoom-src" "${GITHUB_WORKSPACE}/dist"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nova-zoom-unsigned-apks
          path: dist/
          retention-days: 30
          if-no-files-found: error
  sign-and-publish:
    if: github.repository == 'handsomelong922/aos-AVP' && github.ref == 'refs/heads/nova-zoom'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: nova-zoom-next-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nova-zoom-unsigned-apks
          path: ${{ runner.temp }}/nova-zoom-unsigned
      - name: Provision Android signature tools
        run: |
          sdk=$(bash zoom/provision-sdk.sh "${RUNNER_TEMP}/nova-zoom-sign-sdk")
          echo "NOVA_SIGN_TOOLS=$sdk/build-tools/37.0.0" >> "$GITHUB_ENV"
      - name: Sign and verify both APKs
        env:
          NOVA_ZOOM_RELEASE_SIGNING: ${{ secrets.NOVA_ZOOM_RELEASE_SIGNING }}
        run: bash zoom/signing/sign-next-ci.sh "$RUNNER_TEMP/nova-zoom-unsigned" "$RUNNER_TEMP/nova-zoom-signed" "$NOVA_SIGN_TOOLS"
      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash zoom/signing/publish-next-ci.sh "$RUNNER_TEMP/nova-zoom-signed"
